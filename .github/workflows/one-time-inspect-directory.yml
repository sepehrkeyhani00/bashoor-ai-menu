name: One-time read submission result

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-result:
    runs-on: ubuntu-latest
    steps:
      - name: Download prior public response
        uses: actions/download-artifact@v4
        with:
          name: llmslist-submission-response
          path: public-result
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: sepehrkeyhani00/bashoor-ai-menu
          run-id: 34519034569
      - name: Print public response
        shell: bash
        run: |
          set -euo pipefail
          for result_file in curl-exit.txt http-code.txt response.headers response.json; do
            printf '\n--- %s ---\n' "$result_file"
            sed -n '1,100p' "public-result/$result_file"
          done
